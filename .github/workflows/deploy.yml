name: Deploy to Cloudflare Pages
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
  deployments: write
concurrency:
  group: "cf-pages-tuseguridad"
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - run: npx astro check
      - run: npm run build
      - name: Sellar build-id
        run: echo "${{ github.sha }}" > dist/build-id.txt
      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@3 pages project create tuseguridad --production-branch=main 2>/dev/null || true
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=tuseguridad --branch=main --commit-dirty=true
      - name: Verificar que el dominio sirve este commit
        run: |
          DOMINIO="tuseguridad.mx"
          for i in $(seq 1 12); do
            sleep 10
            LIVE=$(curl -fsSL --max-time 15 "https://$DOMINIO/build-id.txt?cb=${RANDOM}${i}" 2>/dev/null | tr -d "[:space:]" || echo "")
            if [ "$LIVE" = "${{ github.sha }}" ]; then
              echo "OK — $DOMINIO sirve ${GITHUB_SHA:0:12}"
              exit 0
            fi
            echo "intento $i/12 — dominio devuelve \x27${LIVE:0:12}\x27, esperado \x27${GITHUB_SHA:0:12}\x27"
          done
          echo "::error::$DOMINIO NO sirve este build tras 2 min."
          exit 1
